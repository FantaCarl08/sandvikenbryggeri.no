<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5277501666717363" crossorigin="anonymous"></script>
  <title>Sandviken Bryggeri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <style>
    :root {
      --front: #a3307a;  /* mystisk rød/lilla, forsiden av bokstavene */
      --side:  #3a0d2b;  /* mørk lilla, bak/sider av bokstavene */
      --white: #ffffff;
      --text:  #111111;
      --bg:    #ffffff;
      --stretch: 2.6;    /* hvor høy logoen er strukket */
    }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Times New Roman", Times, serif;   /* søppel med vilje */
      font-size: 18px;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ---------- 3D-logo som spinner ---------- */
    #midt { position: relative; }
    #stage {
      perspective: 2000px;
      font-size: min(11vw, 18vh);   /* størrelsen på logoen: bredde- og høydebegrenset */
      /* plass så den strukne teksten ikke stikker inn i passordfeltet */
      padding: calc((var(--stretch) - 1) * 0.525em + 0.15em) 0;
      max-width: 100%;
    }
    #logo {
      position: relative;
      display: inline-block;
      transform-style: preserve-3d;
      font-family: Anton, Impact, "Arial Narrow", sans-serif;
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
      text-align: center;
      /* jevn, sakte spinn rundt sitt eget senter */
      animation: spin 9s linear infinite;
    }
    #logo .layer { display: block; }
    #logo .layer.back { position: absolute; left: 0; top: 0; width: 100%; }
    @keyframes spin {
      from { transform: rotateY(0deg) scaleY(var(--stretch)); }
      to   { transform: rotateY(360deg) scaleY(var(--stretch)); }
    }

    /* ---------- søppel ---------- */
    .box {
      border: 4px ridge var(--front);
      padding: 0.8rem 1.2rem;
      margin: 1rem auto;
      max-width: 30rem;
    }
    label { display: block; margin-bottom: 0.6rem; }
    input, button { font-size: 1rem; }
    #pw {
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--front);
      border-radius: 0;
      background: var(--white);
      color: var(--text);
      font-family: inherit;
    }
    #pw:focus-visible { outline: 2px solid var(--front); outline-offset: 3px; }
    #enter {
      padding: 0.55rem 0.8rem;
      border: 1px solid var(--front);
      border-radius: 0;
      background: transparent;
      color: var(--front);
      font-family: inherit;
      cursor: pointer;
    }
    #enter:hover { background: var(--front); color: var(--white); }
    #enter:focus-visible { outline: 2px solid var(--front); outline-offset: 3px; }
    .contact-details {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      width: 100%;
      margin-top: 0.75rem;
      padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
    }
    .contact-details p { margin: 0; }
    #gate, #site { position: relative; z-index: 10; }
    #midt #gate {
      position: absolute;
      left: 50%;
      top: calc(100% + 1rem);
      transform: translateX(-50%);
      width: max-content;
      max-width: 100vw;
    }
    #site {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 80rem;
      margin: auto;
      box-sizing: border-box;
      overflow: hidden;
      text-align: center;
      z-index: 10;
    }
    .countdown-stage {
      flex: 0 0 auto;
      width: 100%;
      padding: 0.75rem 0 1rem;
      pointer-events: none;
      text-align: center;
    }
    .site-menu {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      overflow-y: auto;
    }
    .site-menu > p { margin: 0.45rem 0; }
    #countdown {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.06em 0.08em;
      font-family: Anton, Impact, "Arial Narrow", sans-serif;
      font-size: min(18.5vw, 30vh, 16rem);
      line-height: 1;
      white-space: nowrap;
      color: var(--front);
    }
    .countdown-value { min-width: 1.08em; text-align: center; }
    a { color: var(--front); }

    .marquee { width: 100%; max-width: 34rem; overflow: hidden; white-space: nowrap; margin: 0.5rem auto; border-top: 2px dashed var(--front); border-bottom: 2px dashed var(--front); }
    .marquee span { display: inline-block; padding-left: 100%; color: var(--front); font-weight: bold; animation: scroll 12s linear infinite; }
    @keyframes scroll { to { transform: translateX(-100%); } }

    .blink { animation: blink 1s steps(1) infinite; color: var(--front); font-weight: bold; }
    @keyframes blink { 50% { visibility: hidden; } }

    .counter { font-family: "Courier New", monospace; background: var(--white); color: var(--text); padding: 0 0.4rem; letter-spacing: 0.15em; }

    @media (max-width: 600px) {
      :root { --stretch: 3.4; }   /* ekstra høy på smale skjermer */
      body { font-size: 16px; padding: 0.75rem; }
      #countdown { font-size: min(20vw, 30vh, 16rem); transform: scaleX(1.04); }
      input { width: 10rem; }
      .box { padding: 0.6rem 0.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      #logo, .marquee span, .blink { animation: none; }
      .marquee span { padding-left: 0; }
    }
  </style>
</head>
<body>

  <div id="midt">
    <!-- 3D-logo som spinner (midt på skjermen) -->
    <div id="stage">
      <div id="logo" role="img" aria-label="Sandviken Bryggeri"></div>
    </div>

    <!-- Passordsperre (rett under logoen) -->
    <div id="gate">
      <input type="password" id="pw" aria-label="Skriv inn passord" autocomplete="off" autofocus>
      <button id="enter">OK</button>
      <p id="error" role="alert"></p>
    </div>
  </div>

  <!-- Selve nettsiden (skjult til passordet er riktig) -->
  <div id="site">
    <div class="countdown-stage">
      <div id="countdown" role="timer" aria-label="00:00:00:00">
        <span class="countdown-value" id="countdown-days">00</span>
        <span class="countdown-value" id="countdown-hours">00</span>
        <span class="countdown-value" id="countdown-minutes">00</span>
        <span class="countdown-value" id="countdown-seconds">00</span>
      </div>
    </div>
    <nav class="site-menu" aria-label="Hovedmeny">
      <p><a href="butikk.html">Butikk</a></p>
      <p id="playlist-menu-item" hidden><a href="https://soundcloud.com/carl-keef-763110059/sets/untitled-playlist" target="_blank" rel="noopener noreferrer">Playlist</a></p>
      <p><a href="https://www.instagram.com/sandvikenbryggeri/">Instagram</a></p>
      <p><a href="#" id="loggut">Logg ut</a></p>
    </nav>
    <div class="contact-details" aria-label="Kontaktinformasjon">
      <p><a href="tel:+4791264401">+47 9126 4401</a></p>
      <p><a href="mailto:sandvikenbryggeri@gmail.com">sandvikenbryggeri@gmail.com</a></p>
    </div>
  </div>

  <script>
    var PASSWORD = "fyresyre"; // <-- skriv inn ditt eget passord her
    var PLAYLIST_PASSWORD = "grischøl";

    // ---- Bygg 3D-teksten av stablede kopier ----
    var TEXT = "Sandviken Bryggeri";
    var LAYERS = 36;        // flere lag = tykkere bokstaver
    var STEP = 0.014;       // em mellom lagene (skalerer med tekststørrelsen)
    var logo = document.getElementById("logo");
    var half = (LAYERS * STEP) / 2;

    for (var i = 0; i < LAYERS; i++) {
      var s = document.createElement("span");
      s.className = "layer" + (i === 0 ? "" : " back");
      s.setAttribute("aria-hidden", "true");
      s.textContent = TEXT;
      s.style.transform = "translateZ(" + (half - i * STEP) + "em)";
      // forsiden lys, sidene blir mørkere
      var pct = Math.round(100 - (i / (LAYERS - 1)) * 100);
      s.style.color = i === 0 ? "var(--front)"
        : "color-mix(in srgb, var(--front) " + Math.round(pct * 0.55) + "%, var(--side))";
      logo.appendChild(s);
    }

    var countdown = document.getElementById("countdown");
    var countdownDays = document.getElementById("countdown-days");
    var countdownHours = document.getElementById("countdown-hours");
    var countdownMinutes = document.getElementById("countdown-minutes");
    var countdownSeconds = document.getElementById("countdown-seconds");

    function getNextSunday() {
      var target = new Date();
      target.setHours(0, 0, 0, 0);
      var daysUntilSunday = (7 - target.getDay()) % 7 || 7;
      target.setDate(target.getDate() + daysUntilSunday);
      return target;
    }

    var countdownTarget = getNextSunday();
    function updateCountdown() {
      var remaining = countdownTarget.getTime() - Date.now();
      if (remaining <= 0) {
        countdownTarget = getNextSunday();
        remaining = countdownTarget.getTime() - Date.now();
      }

      var days = Math.floor(remaining / 86400000);
      var hours = Math.floor((remaining % 86400000) / 3600000);
      var minutes = Math.floor((remaining % 3600000) / 60000);
      var seconds = Math.floor((remaining % 60000) / 1000);
      countdownDays.textContent = String(days).padStart(2, "0");
      countdownHours.textContent = String(hours).padStart(2, "0");
      countdownMinutes.textContent = String(minutes).padStart(2, "0");
      countdownSeconds.textContent = String(seconds).padStart(2, "0");
      var display = [days, hours, minutes, seconds].map(function (value) {
        return String(value).padStart(2, "0");
      }).join(":");
      countdown.setAttribute("aria-label", days + " dager, " + hours + " timer, "
        + minutes + " minutter, " + seconds + " sekunder");
    }

    updateCountdown();
    window.setInterval(updateCountdown, 1000);

    // ---- Passordsjekk ----
    var stage = document.getElementById("stage");
    var gate = document.getElementById("gate");
    var site = document.getElementById("site");
    var input = document.getElementById("pw");
    var error = document.getElementById("error");
    var playlistMenuItem = document.getElementById("playlist-menu-item");

    function visMeny(showPlaylist) {
      // bytt hele skjermen: skjul logo og passordfelt, vis bare menyen
      stage.style.display = "none";
      gate.style.display = "none";
      site.style.display = "flex";
      playlistMenuItem.hidden = !showPlaylist;
    }

    function tryEnter() {
      var showPlaylist = input.value === PLAYLIST_PASSWORD;
      if (input.value === PASSWORD || showPlaylist) {
        try {
          sessionStorage.setItem("innlogget", "ja");
          sessionStorage.setItem("playlist-tilgang", showPlaylist ? "ja" : "nei");
        } catch (e) {}
        visMeny(showPlaylist);
      } else {
        error.textContent = "FEIL PASSORD";
        input.value = "";
        input.focus();
      }
    }

    // Allerede logget inn i denne fanen? Da går vi rett til menyen.
    try {
      if (sessionStorage.getItem("innlogget") === "ja") {
        visMeny(sessionStorage.getItem("playlist-tilgang") === "ja");
      }
    } catch (e) {}

    // ---- Logg ut: tilbake til passordsiden ----
    document.getElementById("loggut").addEventListener("click", function (e) {
      e.preventDefault();
      try {
        sessionStorage.removeItem("innlogget");
        sessionStorage.removeItem("playlist-tilgang");
      } catch (err) {}
      site.style.display = "none";
      stage.style.display = "";
      gate.style.display = "";
      error.textContent = "";
      input.value = "";
      input.focus();
    });

    document.getElementById("enter").addEventListener("click", tryEnter);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") tryEnter();
    });
  </script>

</body>
</html>
