<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandviken Bryggeri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <style>
    :root {
      --front: #a3307a;  /* mystisk rød/lilla, forsiden av bokstavene */
      --side:  #3a0d2b;  /* mørk lilla, bak/sider av bokstavene */
      --white: #ffffff;
      --bg:    #000000;
      --stretch: 1.8;    /* hvor høy logoen er strukket */
    }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: "Times New Roman", Times, serif;   /* søppel med vilje */
      font-size: 18px;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ---------- 3D-logo som spinner ---------- */
    #stage { perspective: 2000px; padding: 4rem 0 5.5rem; max-width: 100%; }
    #logo {
      position: relative;
      display: inline-block;
      transform-style: preserve-3d;
      font-family: Anton, Impact, "Arial Narrow", sans-serif;
      font-size: clamp(2rem, 8vw, 9rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
      /* jevn, sakte spinn rundt sitt eget senter */
      animation: spin 14s linear infinite;
    }
    #logo .layer { display: block; }
    #logo .layer.back { position: absolute; left: 0; top: 0; }
    @keyframes spin {
      from { transform: rotateY(0deg) scaleY(var(--stretch)); }
      to   { transform: rotateY(360deg) scaleY(var(--stretch)); }
    }

    /* ---------- søppel ---------- */
    .box {
      border: 4px ridge var(--front);
      padding: 0.8rem 1.2rem;
      margin: 1rem auto;
      max-width: 30rem;
    }
    label { display: block; margin-bottom: 0.6rem; }
    input, button { font-size: 1rem; }        /* standard nettleserutseende, med vilje */
    #error { color: var(--front); font-weight: bold; min-height: 1.4em; margin: 0.6rem 0 0; }
    #gate, #site { position: relative; z-index: 10; }
    #site { display: none; }
    a { color: var(--front); }

    .marquee { width: 100%; max-width: 34rem; overflow: hidden; white-space: nowrap; margin: 0.5rem auto; border-top: 2px dashed var(--front); border-bottom: 2px dashed var(--front); }
    .marquee span { display: inline-block; padding-left: 100%; color: var(--front); font-weight: bold; animation: scroll 12s linear infinite; }
    @keyframes scroll { to { transform: translateX(-100%); } }

    .blink { animation: blink 1s steps(1) infinite; color: var(--front); font-weight: bold; }
    @keyframes blink { 50% { visibility: hidden; } }

    .counter { font-family: "Courier New", monospace; background: var(--white); color: var(--bg); padding: 0 0.4rem; letter-spacing: 0.15em; }

    @media (max-width: 600px) {
      body { font-size: 16px; padding: 0.75rem; }
      #logo { font-size: 10.5vw; }
      #stage { padding: 2.5rem 0 3.5rem; }
      input { width: 10rem; }
      .box { padding: 0.6rem 0.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      #logo, .marquee span, .blink { animation: none; }
      .marquee span { padding-left: 0; }
    }
  </style>
</head>
<body>

  <!-- 3D-logo som spinner -->
  <div id="stage">
    <div id="logo" role="img" aria-label="Sandviken Bryggeri"></div>
  </div>

  <!-- Passordsperre -->
  <div id="gate">
    <label for="pw">Skriv inn passord:</label>
    <input type="password" id="pw" autocomplete="off" autofocus>
    <button id="enter">OK</button>
    <p id="error" role="alert"></p>
  </div>

  <!-- Selve nettsiden (skjult til passordet er riktig) -->
  <div id="site">
    <p>Nettsiden er under bygging</p>
    <p><a href="https://www.instagram.com/sandvikenbryggeri/">Instagram</a></p>
  </div>

  <script>
    var PASSWORD = "fyresyre"; // <-- skriv inn ditt eget passord her

    // ---- Bygg 3D-teksten av stablede kopier ----
    var TEXT = "Sandviken Bryggeri";
    var LAYERS = 36;        // flere lag = tykkere bokstaver
    var STEP = 0.014;       // em mellom lagene (skalerer med tekststørrelsen)
    var logo = document.getElementById("logo");
    var half = (LAYERS * STEP) / 2;

    for (var i = 0; i < LAYERS; i++) {
      var s = document.createElement("span");
      s.className = "layer" + (i === 0 ? "" : " back");
      s.setAttribute("aria-hidden", "true");
      s.textContent = TEXT;
      s.style.transform = "translateZ(" + (half - i * STEP) + "em)";
      // forsiden lys, sidene blir mørkere
      var pct = Math.round(100 - (i / (LAYERS - 1)) * 100);
      s.style.color = i === 0 ? "var(--front)"
        : "color-mix(in srgb, var(--front) " + Math.round(pct * 0.55) + "%, var(--side))";
      logo.appendChild(s);
    }

    // ---- Passordsjekk ----
    var stage = document.getElementById("stage");
    var gate = document.getElementById("gate");
    var site = document.getElementById("site");
    var input = document.getElementById("pw");
    var error = document.getElementById("error");

    function tryEnter() {
      if (input.value === PASSWORD) {
        // bytt hele skjermen: skjul logo og passordfelt, vis bare byggemeldingen
        stage.style.display = "none";
        gate.style.display = "none";
        site.style.display = "block";
      } else {
        error.textContent = "FEIL PASSORD";
        input.value = "";
        input.focus();
      }
    }
    document.getElementById("enter").addEventListener("click", tryEnter);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") tryEnter();
    });
  </script>

</body>
</html>
