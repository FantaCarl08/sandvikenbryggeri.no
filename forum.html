<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forum – Sandviken Bryggeri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <style>
    :root {
      --front: #a3307a;
      --side: #3a0d2b;
      --text: #ffffff;
      --bg: #000000;
      --muted: #c8c0c6;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      max-width: 52rem;
      margin: 0 auto;
      padding: 1.25rem 1rem 4rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Times New Roman", Times, serif;
      font-size: 18px;
    }
    a { color: var(--front); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .topline { display: flex; justify-content: space-between; gap: 1rem; }
    #forum-title-stage {
      width: 100%;
      margin: 2.5rem 0 2rem;
      padding: 0.5rem 0;
      perspective: 2000px;
      text-align: center;
    }
    #forum-title {
      position: relative;
      display: inline-block;
      transform-style: preserve-3d;
      font-family: Anton, Impact, "Arial Narrow", sans-serif;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      animation: forum-title-spin 9s linear infinite;
    }
    #forum-title .layer { display: block; }
    #forum-title .layer.back { position: absolute; top: 0; left: 0; }
    @keyframes forum-title-spin {
      from { transform: rotateY(0deg) scaleY(1.2); }
      to { transform: rotateY(360deg) scaleY(1.2); }
    }
    .feed-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 0 0 1.5rem; }
    .intro { margin: 0; color: var(--muted); }
    h2 { margin: 0; font-size: 1.2rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.35rem; }
    input, textarea {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid #85727f;
      border-radius: 0;
      background: #111111;
      color: var(--text);
      font: inherit;
    }
    textarea { min-height: 8rem; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--front); outline-offset: 2px; }
    button {
      padding: 0.7rem 1rem;
      border: 1px solid var(--front);
      border-radius: 0;
      background: var(--front);
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--side); }
    button:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: 0.65; }
    #open-compose {
      flex-shrink: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--front);
      font: inherit;
      font-weight: 600;
      text-decoration: none;
    }
    #open-compose:hover:not(:disabled) { background: transparent; text-decoration: underline; }
    .compose-dialog {
      width: min(36rem, calc(100% - 2rem));
      max-height: calc(100% - 2rem);
      overflow-y: auto;
      margin: auto;
      padding: 1.25rem;
      border: 2px ridge var(--front);
      border-radius: 0;
      background: var(--bg);
      color: var(--text);
    }
    .compose-dialog::backdrop { background: rgb(0 0 0 / 78%); }
    .compose-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .close-compose { padding: 0.2rem 0.55rem; background: transparent; font-size: 1.4rem; line-height: 1; }
    .notice, #forum-status, #forum-error { min-height: 1.4em; margin: 0.75rem 0 0; }
    .notice { color: var(--muted); font-size: 0.9rem; }
    #forum-error { color: #ff9bbd; }
    #forum-status { margin: 0 0 1rem; color: var(--muted); }
    #forum-posts { margin: 0; padding: 0; list-style: none; }
    .post { padding: 1.25rem 0; border-bottom: 1px solid #4d3545; }
    .post-meta { display: flex; justify-content: space-between; gap: 1rem; color: var(--muted); font-size: 0.9rem; }
    .post-author { color: var(--front); font-weight: 700; }
    .post-body { margin: 0.65rem 0 0; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
    #forum-empty { padding: 1rem 0; color: var(--muted); }
    .honeypot { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }

    @media (max-width: 600px) {
      body { padding: 1rem 0.75rem 3rem; font-size: 16px; }
      #forum-title-stage { margin: 2rem 0 1.5rem; }
      .post-meta { flex-direction: column; gap: 0.2rem; }
      .compose-dialog { padding: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      #forum-title { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="topline" aria-label="Hovedmeny">
      <a href="index.html">&larr; Tilbake</a>
      <a href="butikk.html">Butikk</a>
    </nav>
    <div id="forum-title-stage">
      <div id="forum-title" role="img" aria-label="Forum"></div>
    </div>
    <div class="feed-toolbar">
      <p class="intro">Alle innlegg</p>
      <button id="open-compose" type="button">Skriv innlegg</button>
    </div>
    <p id="forum-status" role="status" aria-live="polite"></p>
    <p id="forum-error" role="alert"></p>
  </header>

  <main>
    <p id="forum-empty" hidden>Ingen innlegg ennå.</p>
    <ol id="forum-posts" aria-live="polite"></ol>
  </main>

  <dialog class="compose-dialog" id="compose-dialog" aria-labelledby="compose-heading">
    <div class="compose-head">
      <h2 id="compose-heading">Skriv innlegg</h2>
      <button class="close-compose" id="close-compose" type="button" aria-label="Lukk">&times;</button>
    </div>
      <form id="forum-form">
        <div class="field">
          <label for="forum-author">Navn</label>
          <input id="forum-author" name="author" maxlength="40" autocomplete="nickname" placeholder="Anonym">
        </div>
        <div class="field">
          <label for="forum-body">Kommentar</label>
          <textarea id="forum-body" name="body" maxlength="1000" required></textarea>
        </div>
        <div class="honeypot" aria-hidden="true">
          <label for="forum-website">La dette feltet stå tomt</label>
          <input id="forum-website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <button id="forum-submit" type="submit" disabled>Publiser</button>
        <p class="notice">Innleggene er offentlige. Ikke skriv personlig eller sensitiv informasjon.</p>
      </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="forum-config.js"></script>
  <script src="forum.js"></script>
</body>
</html>
