  <style>
    :root {
      --front: #a3307a;  /* lilla aksentfarge */
      --side:  #5a1843;  /* mørk lilla 3D-skygge */
      --text:  #111111;  /* mørk tekst */
      --bg:    #ffffff;  /* ren hvit bakgrunn */
      --stretch: 1.6;    /* vertikal strekk for 3D-logo */
      --grid-gap: 1.5rem; /* enhetlig avstand for produkt-rutenett */
      --space-stage-topp: 3.5rem; /* økt vertikal avstand fra BUTIKK-skilt til overskrift */
      --space-topp-grid:  3.5rem; /* økt vertikal avstand fra OFFISIELL MERCH til produktbokser */
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body { 
      margin: 0; 
      padding: 0;
      min-height: 100vh; 
      background: var(--bg);
      color: var(--text);
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      text-align: center;
      overflow-x: hidden;
    }

    body {
      padding: 1.5rem 1rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    a { 
      color: var(--front); 
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }
    a:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    #stage { 
      perspective: 2000px; 
      padding: 0.75rem 0 0.5rem; 
      width: 100%; 
      margin-bottom: var(--space-stage-topp); /* Betydelig økt mellomrom til Tilbake / OFFISIELL MERCH */
    }

    #logo {
      position: relative;
      display: inline-block;
      transform-style: preserve-3d;
      font-family: 'Anton', Impact, "Arial Narrow", sans-serif;
      font-size: clamp(2.4rem, 8vw, 5.5rem);
      line-height: 1;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      animation: spin 9s linear infinite;
    }
    #logo .layer { display: block; }
    #logo .layer.back { position: absolute; left: 0; top: 0; }
    
    @keyframes spin {
      from { transform: rotateY(0deg) scaleY(var(--stretch)); }
      to   { transform: rotateY(360deg) scaleY(var(--stretch)); }
    }

    .topp { 
      position: relative; 
      z-index: 10; 
      width: 100%;
      max-width: 44rem;
      margin-bottom: var(--space-topp-grid); /* Betydelig økt mellomrom til produktboksene */
      font-size: 0.95rem;
    }
    .topp p {
      margin: 0.2rem 0;
    }
    .snart { 
      color: var(--front); 
      font-weight: bold; 
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
      margin-top: 0.6rem !important;
    }

    .topp-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
    }
    .topp-nav p { margin: 0; }
    .cart-trigger {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--front);
      font: inherit;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .cart-trigger:hover:not(:disabled) {
      opacity: 0.85;
      text-decoration: underline;
    }
    .cart-trigger:focus-visible {
      outline: 2px solid var(--side);
      outline-offset: 3px;
    }
    .cart-trigger:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .grid {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-areas:
        "first second"
        "third fourth";
      justify-items: center;
      gap: var(--grid-gap);
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      text-align: left;
      align-items: start;
    }

    /* Shopify Buy Button Overrides */
    .shopify-buy-frame {
      width: 100% !important;
      margin: 0 !important;
    }

    .shopify-buy-frame--toggle {
      display: none !important;
    }

    #product-component-1790770026577,
    #product-component-1790771795558,
    #product-component-1790853048409 {
      width: 100%;
    }

    #product-component-1790770026577 { grid-area: first; }
    #product-component-1790771795558 { grid-area: second; }
    #product-component-1790840483651 { grid-area: third; }
    #product-component-1790853048409 { grid-area: fourth; }

    #product-component-1790840483651 { width: 100%; }

    .mock-card {
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    .mock-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid #a3307a;
      overflow: hidden;
      background: #fbf8fa;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mock-img-wrapper svg {
      width: 50%;
      height: 50%;
      opacity: 0.7;
    }
    .mock-title {
      color: #111111;
      font-family: "Times New Roman", Times, serif;
      font-size: 1.05rem;
      font-weight: bold;
      margin-top: 0.6rem;
      margin-bottom: 0.2rem;
      line-height: 1.2;
    }
    .mock-price {
      color: #a3307a;
      font-family: "Courier New", monospace;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .mock-select {
      border: 1px solid #a3307a;
      background-color: #ffffff;
      color: #111111;
      width: 100%;
      padding: 8px 10px;
      border-radius: 0px;
      margin-bottom: 0.6rem;
      font-family: "Times New Roman", Times, serif;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .mock-btn {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
      letter-spacing: 0.05em;
      padding: 12px 0;
      background-color: #a3307a;
      border: none;
      border-radius: 0px;
      width: 100%;
      cursor: pointer;
      text-transform: uppercase;
      transition: background-color 0.2s ease;
    }
    .mock-btn:hover {
      background-color: #8e2568;
    }

    @media (max-width: 600px) {
      body { padding: 1rem 0.75rem 2.5rem; }
      #logo { font-size: 13vw; }
      #stage { 
        padding: 0.5rem 0 0.5rem; 
        margin-bottom: 2.2rem; /* Tilpasset avstand på mobil */
      }
      .topp {
        margin-bottom: 2.2rem; /* Tilpasset avstand på mobil */
      }
      :root { --grid-gap: 1.25rem; }
      .grid {
        grid-template-columns: 1fr;
        grid-template-areas: "first" "third" "second" "fourth";
        gap: var(--grid-gap);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #logo { animation: none; }
    }

  <script>
    (function init3DLogo() {
      var TEXT = "Butikk";
      var LAYERS = 32;
      var STEP = 0.013;
      var logo = document.getElementById("logo");
      if (!logo) return;
      var half = (LAYERS * STEP) / 2;

      for (var i = 0; i < LAYERS; i++) {
        var s = document.createElement("span");
        s.className = "layer" + (i === 0 ? "" : " back");
        s.setAttribute("aria-hidden", "true");
        s.textContent = TEXT;
        s.style.transform = "translateZ(" + (half - i * STEP) + "em)";
        var pct = Math.round(100 - (i / (LAYERS - 1)) * 100);
        s.style.color = i === 0 ? "var(--front)"
          : "color-mix(in srgb, var(--front) " + Math.round(pct * 0.55) + "%, var(--side))";
        logo.appendChild(s);
      }
    })();
  </script>

  <script type="text/javascript">

  (function () {
    var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js';
    if (window.ShopifyBuy) {
      if (window.ShopifyBuy.UI) {
        ShopifyBuyInit();
      } else {

      }
    } else {

    }
    
    function loadScript() {
      var script = document.createElement('script');
      script.async = true;
      script.src = scriptURL;
      (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(script);
      script.onload = ShopifyBuyInit;
    }

    function ShopifyBuyInit() {
      var client = ShopifyBuy.buildClient({
        domain: 'bkdaii-ce.myshopify.com',
        storefrontAccessToken: 'c8440fb8968d85147e68c0efa66ee29a',
      });

      var sharedProductConfig = {
        moneyFormat: '%7B%7Bamount_with_space_separator%7D%7D%20kr',
        options: {
          "product": {
            "styles": {
              "product": {
                "@media (min-width: 601px)": {
                  "max-width": "100%",

                },

              },
              "img": {

              },

              }
            },
            "buttonDestination": "cart",
            "contents": {

            },

          },
          "cart": {

          },
          "toggle": {

                  "background-color": "#8e2568"
                }
              }
            },
            "text": {
              "count": "Handlekurv (%count%)"
            }
          }
        }
      };

      ShopifyBuy.UI.onReady(client).then(function (ui) {
        var node1 = document.getElementById('product-component-1790770026577');
        var node2 = document.getElementById('product-component-1790771795558');

        function installOptionLabels(productNode) {
          var frame = productNode.querySelector("iframe");
          var frameDocument = frame && frame.contentDocument;
          if (!frameDocument) return false;

          if (!frameDocument.querySelector("select")) return false;

          var optionLabels = {
            Color: {
              Cardinal: "Rød",
              Heliconia: "Rosa",
              White: "Hvit",
              Navy: "Navy"
            },
            Size: {
              "11 oz": "3,25 dl",
              "15 oz": "4,44 dl",
              "20 oz": "5,91 dl"
            }
          };

          function updateOptionLabels() {
            Array.from(frameDocument.querySelectorAll("select")).forEach(function (select) {
              var labels = optionLabels[select.name];
              if (!labels) return;
              Array.from(select.options).forEach(function (option) {
                var label = labels[option.value];
                if (label && option.textContent !== label) option.textContent = label;
              });
            });
          }

          updateOptionLabels();
          new MutationObserver(updateOptionLabels).observe(frameDocument.body, {
            childList: true,
            subtree: true,
            characterData: true
          });
          return true;
        }

        function chooseRandomColor(productComponent) {
          var colorOption = productComponent.model.options.find(function (option) {
            return option.name === "Color";
          });
          if (!colorOption) return;

          var colors = colorOption.values.map(function (value) {
            return value.value;
          });
          var availableColors = colors.filter(function (color) {
            return productComponent.model.variants.some(function (variant) {
              return variant.available && variant.selectedOptions.every(function (option) {
                if (option.name === "Color") return option.value === color;
                return productComponent.selectedOptions[option.name] === option.value;
              });
            });
          });
          var choices = availableColors.length ? availableColors : colors;
          if (choices.length) {
            var randomColor = choices[Math.floor(Math.random() * choices.length)];
            productComponent.updateVariant("Color", randomColor);
          }
        }

        function waitForOptionLabels(productNode, randomizeColor) {
          var attempts = 0;
          function tryInstall() {
            attempts += 1;
            var productComponent = ui.components.product.find(function (component) {
              return component.node === productNode
                && component.model.variants
                && component.model.variants.length;
            });
            if (randomizeColor && productComponent && productNode.dataset.randomColorChosen !== "true") {
              productNode.dataset.randomColorChosen = "true";
              chooseRandomColor(productComponent);
              window.setTimeout(tryInstall, 0);
              return;
            }
            if (productComponent && installOptionLabels(productNode)) return;
            if (attempts >= 100) return;
            window.setTimeout(tryInstall, 100);
          }
          tryInstall();
        }

        if (node1) {
          node1.dataset.rendered = "true";
          node1.innerHTML = "";
          ui.createComponent('product', Object.assign({}, sharedProductConfig, {
            id: '15399657373975',
            node: node1
          }));
          waitForOptionLabels(node1, true);
        }

        if (node2) {
          node2.dataset.rendered = "true";
          node2.innerHTML = "";
          ui.createComponent('product', Object.assign({}, sharedProductConfig, {
            id: '15399682769175',
            node: node2
          }));
          waitForOptionLabels(node2, true);
        }

        var node3 = document.getElementById('product-component-1790840483651');
        if (node3) {
          node3.dataset.rendered = "true";
          node3.innerHTML = "";
          var mugConfig = Object.assign({}, sharedProductConfig, {
            id: '15401242067223',
            variantId: '67612918186263',

          });
          mugConfig.options = Object.assign({}, sharedProductConfig.options, {
            product: Object.assign({}, sharedProductConfig.options.product, {

                }
              }
            })
          });
          ui.createComponent('product', mugConfig);
          waitForOptionLabels(node3, false);
        }

        var node4 = document.getElementById('product-component-1790853048409');
        if (node4) {
          node4.dataset.rendered = "true";
          node4.innerHTML = "";
          var product4Config = Object.assign({}, sharedProductConfig, {
            id: '15401310060823',
            node: node4
          });
          product4Config.options = Object.assign({}, sharedProductConfig.options, {
            product: Object.assign({}, sharedProductConfig.options.product, {
              contents: Object.assign({}, sharedProductConfig.options.product.contents, {
                options: false
              })
            })
          });
          ui.createComponent('product', product4Config);
        }

        var cartButton = document.getElementById("cart-trigger");
        var cartCount = document.getElementById("cart-count");
        if (cartButton && cartCount) {
          cartButton.addEventListener("click", function (event) {
            event.stopPropagation();
            if (!ui.cartOpen) ui.openCart();

          var toggleFrameObserver;
          function syncCartCount() {
            var toggleFrame = document.querySelector('iframe[name="frame-toggle"]');
            if (!toggleFrame) return false;

            var countNode = toggleFrame.contentDocument
              && toggleFrame.contentDocument.querySelector(".shopify-buy__cart-toggle__count");
            if (!countNode) {
              if (toggleFrame.dataset.cartCountObserved !== "true" && toggleFrame.contentDocument) {
                toggleFrame.dataset.cartCountObserved = "true";
                var countNodeObserver = new MutationObserver(function () {
                  if (syncCartCount()) countNodeObserver.disconnect();
                });
                countNodeObserver.observe(toggleFrame.contentDocument, {
                  childList: true,
                  subtree: true
                });
              }
              return false;
            }

            function updateCartCount() {
              var count = countNode.textContent.trim() || "0";
              cartCount.textContent = count;
              cartButton.setAttribute("aria-label", "Handlekurv, " + count
                + (count === "1" ? " vare" : " varer"));
            }

            updateCartCount();
            cartButton.disabled = false;
            new MutationObserver(updateCartCount).observe(countNode, {
              childList: true,
              characterData: true,
              subtree: true
            });
            toggleFrameObserver.disconnect();
            return true;
          }

          toggleFrameObserver = new MutationObserver(syncCartCount);
          toggleFrameObserver.observe(document.body, { childList: true, subtree: true });
          syncCartCount();
        }
      });
    }
  })();
